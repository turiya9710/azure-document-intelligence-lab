name: build

on:
  push:
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build src/AzureDocumentIntelligenceLab/AzureDocumentIntelligenceLab.csproj -c Release

  sample-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate sample data (the generator verifies every label box against the PDF text)
        run: |
          pip install -r tools/requirements.txt
          python tools/generate_sample_data.py --out "$RUNNER_TEMP/sample-data"
